# example.invalid — Minecraft hosting site + real control panel, behind Cloudflare
# (Full/strict). Cloudflare forces HTTPS at the edge and connects to the origin
# on :443, so an example.invalid :443 vhost with a valid cert is required. Cloudflare
# real-IP restoration is global (conf.d/cloudflare-realip.conf).
#
# nginx serves the built static site from /var/www/example.invalid and reverse-proxies
# the API and the live console WebSocket to the Endhost backend on 127.0.0.1:8791
# (systemd unit endhost.service). $connection_upgrade comes from
# conf.d/websocket_upgrade.conf.

server {
    listen 80;
    listen [::]:80;
    server_name example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/example.invalid;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.invalid;

    root /var/www/example.invalid;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/example.invalid;
        default_type "text/plain";
    }

    # never serve dotfiles
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    # API + live console WebSocket → the Endhost backend. ^~ so it always wins
    # over the static asset regex below.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;   # the console WS is long-lived
        proxy_send_timeout 3600s;
    }

    # the dashboard is an extensionless path; /panel stays as a redirect for old links
    location = /dashboard { try_files /dashboard.html =404; }
    location = /panel { return 301 /dashboard; }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?|wav|ogg|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ =404; }
}
